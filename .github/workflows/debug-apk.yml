name: Eta Debug APK

# 只产出 Debug APK，不碰发布证书。
# 上游的 Eta Build 需要 4 个 Actions Secrets（ETA_RELEASE_KEYSTORE_BASE64 /
# ETA_RELEASE_STORE_PASSWORD / ETA_RELEASE_KEY_ALIAS / ETA_RELEASE_KEY_PASSWORD），
# 而 fork 不会继承上游的 Secrets，所以那条工作流在 fork 上必然在
# “还原发布证书”一步 exit 1，连 assemble 都到不了，因此看不到任何 artifact。
# 这个工作流刻意只跑 :app:assembleDebug（debug 用的是 AGP 自动生成的调试证书），
# 不依赖任何 Secrets，只在手动触发时跑，不干扰上面的 CI 与 release 流程。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
