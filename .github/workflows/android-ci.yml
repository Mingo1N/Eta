name: Eta Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Debug 单元测试与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 运行 Debug 单元测试
        shell: bash
        run: |-
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 仓库此前没有在 CI 里跑过 lint（release 工作流的 checkReleaseBuilds = false，且没有 baseline），
      # 所以先报告而不阻塞合并，避免历史遗留问题把功能 PR 卡住。
      - name: 运行 Lint（不阻塞）
        continue-on-error: true
        shell: bash
        run: |-
          ./gradlew --no-daemon --no-configuration-cache \
            :app:lintDebug 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Actions 日志包需要登录态才能下载，注解则是公开可读的；失败时把关键行写成注解，
      # 让没有仓库凭据的贡献者也能直接看到编译与测试错误。
      - name: 输出失败摘要
        if: always()
        shell: bash
        run: |-
          python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import re
          import sys

          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              print("::error::missing build log")
              raise SystemExit(0)

          if not any("BUILD FAILED" in line for line in lines):
              raise SystemExit(0)

          pattern = re.compile(
              r"^e: |^\* What went wrong|> Task .+ FAILED|^Caused by:|\w+Test > .+ (FAILED|SKIPPED)|\berror:",
          )
          hits = [line for line in lines if pattern.search(line)][:8] or lines[-8:]
          for line in hits:
              print("::error::" + line.replace("%", "%25")[:700])

          # Gradle 的控制台输出不含断言的 expected/actual，断言文本只在 JUnit XML 里。
          import glob
          import xml.etree.ElementTree as ET

          shown = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for failure in case.findall("failure"):
                      message = " ".join((failure.get("message") or failure.text or "").split())
                      text = "%s :: %s" % (case.get("name"), message)
                      print("::error::" + text.replace("%", "%25")[:700])
                      shown += 1
                      if shown >= 6:
                          raise SystemExit(0)
          PY
